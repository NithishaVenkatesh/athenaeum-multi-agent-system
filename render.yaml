# Render Blueprint — Athenaeum backend (FREE plan).
#
# The free instance sleeps after ~15 min idle and cold-starts on the next request
# (~1 min) — fine for demos. The frontend deploys separately to Vercel.
#
# Secrets are NOT in this file. They live in Infisical (project
# "athenaeum-multi-agent-system", env "prod") and are pushed to the service's env
# vars after creation, so nothing sensitive is committed. Every provider is a free
# tier with no card: Groq + Gemini (LLMs), Cohere (embeddings), Qdrant Cloud (vectors).
#
# rootDir points Render into the backend; the repo clone keeps athenaeum/ and
# assessments/ as siblings, so the catalog/bank loaders (parents[3]) still resolve.
services:
  - type: web
    name: athenaeum-backend
    runtime: python
    plan: free
    region: singapore            # closest free Render region to India
    rootDir: ayanakoji/backend
    healthCheckPath: /health
    buildCommand: "pip install uv && uv sync --frozen --no-dev --group llm"
    startCommand: ".venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
