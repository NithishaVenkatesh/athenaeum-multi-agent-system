[project]
name = "athenaeum-backend"
version = "0.1.0"
description = "Athenaeum — Enterprise Learning Agent backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]
# Live LLM providers (Groq + Gemini both speak the OpenAI chat API). Optional group
# (not installed in the offline CI lane) so the web skeleton + unit tests stay
# cloud-free and fast. Cohere + Qdrant are called over plain httpx (no SDK).
llm = [
    "openai>=1.54",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─────────────────────────────────────────────────────────────
# Tooling config
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

# The optional openai SDK may be absent in the offline lane; tolerate missing stubs.
# jsonschema ships no type stubs — tolerate it the same way.
[[tool.mypy.overrides]]
module = ["openai.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: tests that hit live providers (need keys + the llm group)"]

[tool.coverage.run]
# Thin live-provider seams exercised by the live smoke, not the offline unit gate.
omit = [
    "tests/*",
    "scripts/*",
]
